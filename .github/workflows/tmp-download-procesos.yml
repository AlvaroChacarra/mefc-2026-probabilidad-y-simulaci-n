name: tmp-download-procesos
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare files
        run: |
          mkdir -p download
          cp entrega-2-procesos-estocasticos/output/main.html download/procesos_estocasticos.html
          cp entrega-2-procesos-estocasticos/output/procesos_estocasticos.pdf download/procesos_estocasticos.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: procesos-estocasticos-final
          path: download/
          retention-days: 1
