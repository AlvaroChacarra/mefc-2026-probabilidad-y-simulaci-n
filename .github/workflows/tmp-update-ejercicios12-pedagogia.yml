name: tmp-update-ejercicios12-pedagogia

on:
  push:
    branches:
      - docs/ejercicios-1-2-friendly-pedagogia

permissions:
  contents: write

jobs:
  update-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ejercicios-1-2-friendly-pedagogia

      - name: Refine pedagogical continuity in exercises 1 and 2
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, copy

          files = {
              'e1': pathlib.Path('entrega-2-procesos-estocasticos/1-cadenas-markov-ratings/ejercicio1_cadenas_markov_ratings.ipynb'),
              'e2': pathlib.Path('entrega-2-procesos-estocasticos/2-ito-martingalas/ejercicio2_ito_martingalas.ipynb'),
          }

          def txt(cell):
              s = cell.get('source', '')
              return ''.join(s) if isinstance(s, list) else s

          def md(text, cid):
              return {'cell_type':'markdown','id':cid,'metadata':{},'source':text.splitlines(keepends=True)}

          def insert_before_heading(nb, heading, cell):
              for i,c in enumerate(nb['cells']):
                  if c.get('cell_type')=='markdown' and heading in txt(c):
                      nb['cells'].insert(i, cell)
                      return True
              return False

          def prepend_to_heading_cell(nb, heading, addition):
              for c in nb['cells']:
                  if c.get('cell_type')=='markdown' and heading in txt(c):
                      t = txt(c)
                      if addition.strip() not in t:
                          pos = t.find('\n', t.find(heading))
                          c['source'] = (t[:pos+1] + '\n' + addition + '\n' + t[pos+1:]).splitlines(keepends=True)
                      return True
              return False

          # ---------------- Exercise 1 ----------------
          p = files['e1']
          nb = json.loads(p.read_text(encoding='utf-8'))
          before_code = [json.dumps(c, sort_keys=True, ensure_ascii=False) for c in nb['cells'] if c.get('cell_type')=='code']

          map1 = r'''### Mapa conceptual del ejercicio 1

La matriz de transición anual es el punto de partida. Conviene leer todo el ejercicio como una sola cadena:

$$
\boxed{
P
\longrightarrow P^n
\longrightarrow \text{probabilidad de default}
\longrightarrow \text{defaults esperados de la cohorte}
\longrightarrow \text{distribución de rating a 25 años}
}
$$

- $P$ responde a **qué puede ocurrir en un año**.
- $P^n$ responde a **qué puede haber ocurrido después de $n$ años**.
- Una fila de $P^n$ es una distribución condicionada al rating inicial.
- $p_0P^n$ mezcla esas distribuciones cuando el rating inicial también es aleatorio.

La simulación aparecerá al final como comprobación de estos resultados analíticos, no como sustituto de ellos.
'''
          insert_before_heading(nb, '## Apartado 1.a', md(map1, 'mapa-ejercicio1'))

          add1a = r'''### Antes de calcular: qué significa elevar $P$

Si una empresa empieza en el estado $i$, la entrada $P_{ij}$ es la probabilidad de terminar **un año después** en $j$.

Para dos años no basta con mirar una sola transición. La empresa puede pasar por cualquier estado intermedio $k$:

$$
(P^2)_{ij}=\sum_k P_{ik}P_{kj}.
$$

Cada producto $P_{ik}P_{kj}$ representa un camino de dos pasos $i\to k\to j$; la suma recoge todos los caminos posibles. Repetir esta idea genera $P^3,P^4,\ldots,P^n$. Por eso $P^n$ ya contiene automáticamente todos los caminos de $n$ años compatibles con la cadena.

### Dos probabilidades distintas de default

Para una empresa que empieza en rating $i$, definimos

$$
F_i(n)=P(X_n=D\mid X_0=i).
$$

Como Default es absorbente, estar en Default en el año $n$ equivale a haber hecho default **en algún momento hasta ese año**. Por tanto, $F_i(n)$ es probabilidad acumulada.

Si $\tau$ es el primer año de default,

$$
P(\tau=n\mid X_0=i)=F_i(n)-F_i(n-1).
$$

La lectura es directa: **default acumulado hasta hoy menos default acumulado hasta ayer = nuevos defaults del año**.
'''
          prepend_to_heading_cell(nb, '## Apartado 1.a', add1a)

          add1b = r'''### El puente de probabilidad individual a número de empresas

En 1.a cada cantidad estaba condicionada al rating inicial de **una empresa**. Ahora usamos la composición real de la cohorte.

Si hay $N_i$ compañías con rating inicial $i$ y

$$
p_i(n)=P(\tau=n\mid X_0=i),
$$

entonces el número esperado de defaults procedentes de ese rating durante el año $n$ es

$$
E[D_n^{(i)}]=N_i\,p_i(n).
$$

Sumando ratings,

$$
\boxed{E[D_n]=\sum_i N_i\,p_i(n).}
$$

No estamos creando una probabilidad nueva: estamos transformando probabilidades individuales en **conteos esperados** usando cuántas empresas hay en cada grupo.
'''
          prepend_to_heading_cell(nb, '## Apartado 1.b', add1b)

          add1c = r'''### Antes de calcular: aquí hay dos preguntas diferentes

Conviene separar dos objetos que se parecen algebraicamente pero responden a preguntas distintas.

**Si conozco el rating inicial $i$ de la empresa:**

$$
\boxed{e_iP^{25}}
$$

es su distribución de rating a 25 años condicionada a ese punto de partida.

**Si elijo una empresa al azar entre las 5.002 y no observo primero su rating:**

$$
\boxed{p_0P^{25}}
$$

mezcla las distribuciones anteriores usando como pesos las proporciones iniciales de la cohorte.

No son dos métodos para calcular lo mismo; son dos preguntas probabilísticas diferentes.
'''
          prepend_to_heading_cell(nb, '## Apartado 1.c', add1c)

          # clarify data correction section without changing method
          decision = r'''**Decisión sobre el dato de entrada.** El fichero original presenta una inconsistencia de etiquetado entre filas y columnas. La resolvemos una sola vez siguiendo la convención documentada y, desde ese punto, trabajamos con una matriz de transición $P$ coherente de ocho estados. Los controles posteriores verifican que esta decisión se mantiene, pero no forman parte del razonamiento probabilístico principal.

'''
          for c in nb['cells']:
              if c.get('cell_type')=='markdown' and '## Corrección de la estructura de la matriz' in txt(c):
                  t=txt(c)
                  if '**Decisión sobre el dato de entrada.**' not in t:
                      pos=t.find('\n', t.find('## Corrección de la estructura de la matriz'))
                      c['source']=(t[:pos+1]+'\n'+decision+t[pos+1:]).splitlines(keepends=True)
                  break

          # frame simulation as validation
          sim_note = r'''### Simulación: una comprobación, no un método alternativo

La distribución exacta a 25 años ya está dada por $P^{25}$. La simulación reproduce muchas trayectorias de la cadena para comprobar que sus frecuencias empíricas convergen a esa distribución teórica. Primero resolvemos; después validamos.
'''
          insert_before_heading(nb, '### Cómo se simula una compañía', md(sim_note, 'sim-validacion-e1'))

          after_code = [json.dumps(c, sort_keys=True, ensure_ascii=False) for c in nb['cells'] if c.get('cell_type')=='code']
          assert before_code == after_code, 'Exercise 1 code cells changed'
          p.write_text(json.dumps(nb, ensure_ascii=False, indent=1), encoding='utf-8')

          # ---------------- Exercise 2 ----------------
          p = files['e2']
          nb = json.loads(p.read_text(encoding='utf-8'))
          before_code = [json.dumps(c, sort_keys=True, ensure_ascii=False) for c in nb['cells'] if c.get('cell_type')=='code']

          map2 = r'''### Mapa conceptual del ejercicio 2

Los tres apartados usan la misma herramienta —Itô— con objetivos distintos:

$$
\boxed{
\text{2.a: dinámica de un cociente}
\quad\to\quad
\text{2.b: transformar una integral}
\quad\to\quad
\text{2.c: compensar un cuadrado}
}
$$

La regla de trabajo será siempre la misma: **primero decidir qué proceso auxiliar conviene definir, después aplicar Itô y finalmente interpretar el término de deriva y el término aleatorio**.
'''
          insert_before_heading(nb, '## 2.a', md(map2, 'mapa-ejercicio2'))

          add2a = r'''### Antes de derivar: qué estamos intentando conseguir

Definimos

$$
Y_t=\frac{X_t}{N_t}.
$$

No vamos a adivinar $\mu$. El plan es:

$$
\boxed{
Y_t=\frac{X_t}{N_t}
\longrightarrow dY_t
\longrightarrow \text{identificar su término }dt
\longrightarrow \text{elegir }\mu\text{ para anularlo}
}
$$

Para una martingala queremos eliminar la **deriva predecible**, es decir, el coeficiente de $dt$. El ruido browniano puede permanecer.

Al aplicar Itô a $h(x,n)=x/n$ aparecerán cuatro contribuciones con significados distintos:

1. el movimiento de $X_t$;
2. el movimiento de $N_t$;
3. la curvatura de $1/N_t$;
4. la covariación entre los dos ruidos.

La cuarta es la razón por la que no basta con “restar las derivas” de numerador y denominador.
'''
          prepend_to_heading_cell(nb, '## 2.a', add2a)

          add2b = r'''### Antes de aplicar Itô: cómo se nos ocurre qué función usar

Queremos simplificar una integral que contiene $W_t^2\,dW_t$. La pregunta útil no es “¿qué fórmula recuerdo?”, sino:

> ¿Existe una función cuya derivada respecto a $W$ sea $W^2$?

Sí:

$$
f'(w)=w^2
\quad\Longrightarrow\quad
f(w)=\frac{w^3}{3}.
$$

Por eso probamos Itô sobre $W_t^3/3$: su primer término diferencial producirá exactamente $W_t^2\,dW_t$, y la corrección de segundo orden nos dirá qué término adicional aparece.

Esta es una regla útil para el toolset: cuando veas una integral de la forma $\int g(W_t)\,dW_t$, intenta encontrar una primitiva de $g$ y aplicar Itô.

Para $\int t\,dW_t$ la lógica es distinta: el integrando depende del tiempo. Probamos el producto $tW_t$ porque su diferencial contiene precisamente el término $t\,dW_t$ que queremos aislar.
'''
          prepend_to_heading_cell(nb, '## 2.b', add2b)

          add2c1 = r'''### Idea antes de demostrarla: por qué aparece un “cuadrado compensado”

Sea

$$
A_t=\int_0^t s\,dW_s.
$$

$A_t$ es una martingala centrada, pero $A_t^2$ ya no lo es: al cuadrar aparece crecimiento sistemático debido a la variabilidad acumulada del proceso. Itô hará visible ese crecimiento como un término de deriva.

La idea es restarlo exactamente:

$$
\boxed{
A_t
\longrightarrow A_t^2
\longrightarrow \text{Itô introduce deriva}
\longrightarrow A_t^2-\langle A\rangle_t
\longrightarrow \text{martingala}
}
$$

Aquí $\langle A\rangle_t$ mide la variación cuadrática acumulada de $A$. En este ejercicio resultará ser $t^3/3$.
'''
          prepend_to_heading_cell(nb, '## Apartado 2.c.1', add2c1)

          add2c2 = r'''### Cambiamos de pregunta: dinámica frente a distribución

En 2.c.1 demostramos cómo evoluciona $M_t$ en el tiempo y por qué es martingala. Ahora fijamos una fecha $t$ y preguntamos **qué distribución tiene**. Son dos niveles distintos: una propiedad dinámica del proceso y una ley marginal en un instante.
'''
          prepend_to_heading_cell(nb, '## Apartado 2.c.2', add2c2)

          add2c3 = r'''### La simulación entra al final como validación

La teoría ya nos ha dado la dinámica, la esperanza, la varianza y la ley de $M_t$. La simulación no descubre esos resultados: sirve para comprobar que una implementación discreta reproduce lo que la teoría predice y para distinguir error temporal de error Monte Carlo.
'''
          prepend_to_heading_cell(nb, '## 2.c.3', add2c3)

          after_code = [json.dumps(c, sort_keys=True, ensure_ascii=False) for c in nb['cells'] if c.get('cell_type')=='code']
          assert before_code == after_code, 'Exercise 2 code cells changed'
          p.write_text(json.dumps(nb, ensure_ascii=False, indent=1), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entrega-2-procesos-estocasticos/1-cadenas-markov-ratings/ejercicio1_cadenas_markov_ratings.ipynb \
                  entrega-2-procesos-estocasticos/2-ito-martingalas/ejercicio2_ito_martingalas.ipynb
          git diff --cached --quiet || git commit -m 'docs: mejorar continuidad pedagógica de ejercicios 1 y 2 [skip ci]'
          git push origin HEAD:docs/ejercicios-1-2-friendly-pedagogia
