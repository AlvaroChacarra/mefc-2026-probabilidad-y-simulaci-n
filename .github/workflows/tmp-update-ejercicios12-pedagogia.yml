name: tmp-update-ejercicios12-pedagogia

on:
  push:
    branches:
      - docs/ejercicios-1-2-friendly-pedagogia

permissions:
  contents: write

jobs:
  update-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ejercicios-1-2-friendly-pedagogia
      - name: Refine pedagogical continuity
        run: python .github/scripts/tmp_update_ejercicios12_pedagogia.py
      - name: Commit notebook changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entrega-2-procesos-estocasticos/1-cadenas-markov-ratings/ejercicio1_cadenas_markov_ratings.ipynb
          git add entrega-2-procesos-estocasticos/2-ito-martingalas/ejercicio2_ito_martingalas.ipynb
          git diff --cached --quiet || git commit -m 'docs: mejorar continuidad pedagógica de ejercicios 1 y 2 [skip ci]'
          git push origin HEAD:docs/ejercicios-1-2-friendly-pedagogia
