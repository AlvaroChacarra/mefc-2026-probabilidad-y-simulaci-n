name: tmp-regenerate-procesos-outputs

on:
  push:
    branches:
      - build/final-render-procesos

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/final-render-procesos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4 nbformat nbconvert jupyter matplotlib numpy pandas scipy openpyxl latex2mathml
      - name: Install renderer dependencies
        run: |
          npm ci --prefix tools
          npx --prefix tools playwright install chromium
      - name: Regenerate HTML and PDF from canonical notebooks
        run: |
          python tools/build_notebooks_procesos.py
          python tools/build_notebooks_procesos.py --check
          python tools/build_notebooks_procesos.py --pdf
          python tools/build_notebooks_procesos.py --check
      - name: Commit regenerated outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add entrega-2-procesos-estocasticos/output
          git diff --cached --quiet || git commit -m 'build: regenerate final procesos HTML and PDF [skip ci]'
          git push origin HEAD:build/final-render-procesos
