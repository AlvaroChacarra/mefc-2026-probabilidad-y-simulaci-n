name: tmp-chat-download-export

on:
  push:
    branches:
      - tmp/chat-download-export

permissions:
  contents: read

env:
  OUT: entrega-2-procesos-estocasticos/output

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: procesos-estocasticos-final
          path: |
            ${{ env.OUT }}/main.html
            ${{ env.OUT }}/procesos_estocasticos.pdf
          if-no-files-found: error
          retention-days: 1
