name: tmp-fix-ejercicio3-symbol

on:
  push:
    branches:
      - docs/ejercicio-3-friendly-pedagogia

permissions:
  contents: write

jobs:
  fix-symbol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ejercicio-3-friendly-pedagogia
      - name: Fix remaining symbol
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/tmp-fix-ejercicio3-symbol.yml
          git add entrega-2-procesos-estocasticos/3-volatilidad-determinista-asiatica/ejercicio3_volatilidad_determinista_asiatica.ipynb .github/workflows/tmp-fix-ejercicio3-symbol.yml
          git commit -m 'docs: usar X_t de forma consistente en 3.1 [skip ci]'
          git push origin HEAD:docs/ejercicio-3-friendly-pedagogia
